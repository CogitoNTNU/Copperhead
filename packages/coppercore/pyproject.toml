[project]
name = "coppercore"
version = "0.0.1"
description = "Shared core functionality for the Copperhead project."
requires-python = ">=3.12"

dependencies = [
    "gymnasium>=1.3.0",
    "numpy>=2.5.3",
    "pyyaml>=6.0.2",
    "scikit-learn>=1.9.1",
    "wandb>=0.31.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
