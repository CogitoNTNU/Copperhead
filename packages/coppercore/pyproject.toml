[project]
name = "coppercore"
version = "0.0.1"
description = "Shared core functionality for the Copperhead project."
requires-python = ">=3.12"

dependencies = [
    "gymnasium>=1.3.0",
    "imageio>=2.28.1",
    "moviepy>=2.2.1",
    "numpy>=2.5.3",
    "pygame>=2.6.1",
    "pyyaml>=6.0.2",
    "scikit-learn>=1.9.1",
    "wandb>=0.31.0",
]

[project.scripts]
network-graph = "coppercore.cli:graph"
network-flatten = "coppercore.cli:flatten"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
