version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "dependency: "
      include: "scope"
    open-pull-requests-limit: 5
    groups:
      uv-patch:
        patterns:
          - "*"
        update-types:
          - patch
    
      uv-minor:
        patterns:
          - "*"
        update-types:
          - minor
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
