name: mnist_classifier
input_dim: 784
config:
  hidden_dim: 1024
  classes: 10
output_dim: ${classes}

model:
  type: sequential
  layers:
    - type: linear
      output_dim: ${hidden_dim}
    - type: relu
    - type: linear
      output_dim: ${hidden_dim}
    - type: relu
    - type: linear
      output_dim: ${hidden_dim}
    - type: relu
    - type: linear
      output_dim: ${classes}
